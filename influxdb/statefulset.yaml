apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
spec:
  serviceName: "influxdb-hl"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb
    spec:
      containers:
      - name: influxdb
        image: influxdb:1.12.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
          protocol: TCP
          name: http
        volumeMounts:
        - name: influxdb-config
          mountPath: /etc/influxdb/
        - name: influxdb-data
          mountPath: /var/lib/influxdb
        envFrom:
        - configMapRef:
            name: influxdb-env
        - secretRef:
            name: influxdb-env-secret
        resources:
          requests:
            cpu: "500m"
            memory: "500Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: "/health"
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/health"
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: influxdb-config
        configMap:
          name: influxdb-config
  volumeClaimTemplates:
  - metadata:
      name: influxdb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi