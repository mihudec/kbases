apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telegraf
  labels: {}
spec:
  selector:
    matchLabels: {}
  template:
    metadata:
      labels: {}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: telegraf:1.40.3
        imagePullPolicy: IfNotPresent
        name: telegraf
        envFrom:
        - secretRef:
            name: telegraf-env
        args:
          - "--unprotected"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TZ
          value: Europe/Prague
        volumeMounts:
        - mountPath: /etc/telegraf/telegraf.conf
          name: config
          subPath: telegraf.conf
          readOnly: true
        resources:
          limits:
            memory: "256Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_RAW
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: config
        configMap:
          name: telegraf-config
