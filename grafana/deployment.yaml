apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.3
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: grafana-env
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: 256Mi
            cpu: "500m"
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/grafana
          name: config
      volumes:
      - name: config
        configMap:
          defaultMode: 444
          name: grafana-config